<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | 知因 CodeLab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #fdfbf7;
      --bg-card: #fffcf5;
      --text-primary: #1a1a1a;
      --text-secondary: #5a5a5a;
      --accent-blue: #4682b4;
      --fold-blue: #b8d9f0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景 */
    .paper-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(45deg, transparent 48%, rgba(0,0,0,0.025) 49%, rgba(0,0,0,0.025) 51%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(0,0,0,0.025) 49%, rgba(0,0,0,0.025) 51%, transparent 52%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.006) 2px, rgba(0,0,0,0.006) 3px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.006) 2px, rgba(0,0,0,0.006) 3px),
        radial-gradient(circle 500px at var(--mouse-x, 50%) var(--mouse-y, 50%),
          rgba(255, 215, 100, 0.08) 0%, rgba(255, 235, 150, 0.04) 30%, transparent 60%),
        radial-gradient(ellipse 1000px 800px at var(--mouse-x, 50%) var(--mouse-y, 50%),
          rgba(255, 250, 230, 0.25) 0%, transparent 50%),
        linear-gradient(135deg, #fdfbf7 0%, #f9f5ed 50%, #faf7f1 100%);
      background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 40px;
    }

    /* Logo */
    .logo-section {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .logo-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 32px;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .logo-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* 登录卡片 */
    .login-card {
      background: linear-gradient(135deg, var(--bg-card) 0%, #fdfbf3 100%);
      border: 1px solid rgba(0,0,0,0.12);
      padding: 48px;
      border-radius: 16px;
      position: relative;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 12px 40px rgba(0,0,0,0.12);
      overflow: visible;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    /* 折角 */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 72px 72px 0;
      border-color: transparent var(--fold-blue) transparent transparent;
      filter: drop-shadow(-2px 2px 4px rgba(0,0,0,0.15));
      z-index: 2;
      transition: all 0.4s;
    }

    .login-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, transparent 50%, rgba(70, 130, 180, 0.12) 50%);
      z-index: 1;
      transition: all 0.4s;
    }

    /* 角色切换 */
    .role-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .role-tab {
      flex: 1;
      padding: 20px;
      background: rgba(0,0,0,0.02);
      border: 2px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .role-tab:hover {
      background: rgba(0,0,0,0.04);
      transform: translateY(-2px);
    }

    .role-tab.active {
      background: white;
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(70, 130, 180, 0.15);
    }

    .role-tab-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      transition: all 0.3s;
    }

    .role-tab.active .role-tab-icon {
      opacity: 1;
    }

    .role-tab-icon svg {
      width: 100%;
      height: 100%;
    }

    .role-tab-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: all 0.3s;
    }

    .role-tab.active .role-tab-label {
      color: var(--accent-blue);
    }

    /* 表单 */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: white;
      border: 1.5px solid rgba(0,0,0,0.12);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-primary);
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(70, 130, 180, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent-blue) 0%, #5a92c4 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #3a6a94 0%, var(--accent-blue) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(70, 130, 180, 0.4);
    }

    @media (max-width: 768px) {
      .login-container {
        padding: 20px;
      }

      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="paper-bg" id="paperBg"></div>

  <div class="login-container">
    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V9h7V2.99l7 3.5V9h-7v3.99z"/>
        </svg>
      </div>
      <div class="logo-title">知因 CodeLab</div>
      <div class="logo-subtitle">证据驱动的智能验收平台</div>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card" id="loginCard">
      <!-- 角色选择 -->
      <div class="role-tabs">
        <div class="role-tab active" data-role="teacher">
          <div class="role-tab-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4682b4" d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
            </svg>
          </div>
          <div class="role-tab-label">教师</div>
        </div>
        <div class="role-tab" data-role="student">
          <div class="role-tab-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4caf50" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <div class="role-tab-label">学生</div>
        </div>
      </div>

      <!-- 登录表单 -->
      <form>
        <div class="form-group">
          <label class="form-label">邮箱地址</label>
          <input type="email" class="form-input" id="emailInput" placeholder="teacher@codelab.local" required>
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" placeholder="输入你的密码" required>
        </div>

        <button type="submit" class="login-btn">登录</button>
      </form>
    </div>
  </div>

  <script>
    // 背景鼠标交互
    const paperBg = document.getElementById('paperBg');
    let mouseX = 50, mouseY = 50, targetX = 50, targetY = 50;

    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 100;
      targetY = (e.clientY / window.innerHeight) * 100;
      const offsetX = (e.clientX / window.innerWidth - 0.5) * 60;
      const offsetY = (e.clientY / window.innerHeight - 0.5) * 60;
      paperBg.style.backgroundPosition = `
        ${offsetX * 1.2}px ${offsetY * 1.2}px,
        ${-offsetX * 1.2}px ${-offsetY * 1.2}px,
        ${offsetX * 0.3}px ${offsetY * 0.3}px,
        ${-offsetX * 0.3}px ${-offsetY * 0.3}px,
        0 0, 0 0, 0 0
      `;
    });

    function updateBackground() {
      mouseX += (targetX - mouseX) * 0.15;
      mouseY += (targetY - mouseY) * 0.15;
      paperBg.style.setProperty('--mouse-x', `${mouseX}%`);
      paperBg.style.setProperty('--mouse-y', `${mouseY}%`);
      requestAnimationFrame(updateBackground);
    }
    updateBackground();

    // 角色切换
    const roleTabs = document.querySelectorAll('.role-tab');
    const emailInput = document.getElementById('emailInput');

    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const role = tab.dataset.role;
        emailInput.placeholder = role === 'teacher' ? 'teacher@codelab.local' : 'student@codelab.local';
      });
    });

    // 卡片3D倾斜
    const loginCard = document.getElementById('loginCard');
    loginCard.addEventListener('mousemove', (e) => {
      const rect = loginCard.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = (y - centerY) / 15;
      const rotateY = (centerX - x) / 15;

      loginCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    loginCard.addEventListener('mouseleave', () => {
      loginCard.style.transform = 'rotateX(0) rotateY(0)';
    });
  </script>
</body>
</html>
