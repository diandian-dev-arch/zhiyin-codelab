<!doctype html>
<html lang="zh-CN" data-theme="bronze">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 知因 CodeLab</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body data-role="teacher">
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="auth">
      <!-- ================= 左：动画场景 ================= -->
      <section class="scene" aria-hidden="true">
        <canvas class="scene-liquid"></canvas>
        <canvas class="scene-canvas"></canvas>
        <div class="scene-core" id="sceneCore"></div>

        <a class="brand" href="index.html">
          <span class="brand-mark"><i></i></span>
          <span>知因 <b>CodeLab</b></span>
        </a>

        <div class="orbit">
          <span class="o-chip glass" style="--a: 0deg"><i class="ok"></i>E-01 路由跳转</span>
          <span class="o-chip glass" style="--a: 120deg"><i class="warn"></i>E-04 空列表状态</span>
          <span class="o-chip glass" style="--a: 240deg"><i class="ok"></i>E-06 表单校验</span>
        </div>

        <div class="quote">
          <p class="eyebrow" id="quoteKicker">For teachers</p>
          <h2 id="quoteText">证据先行，<br /><em>判断</em>留给你。</h2>
          <p class="serif" id="quoteEn">Evidence first. Judgement is yours.</p>
        </div>
      </section>

      <!-- ================= 右：玻璃表单 ================= -->
      <section class="panel">
        <form class="card glass" id="form" novalidate>
          <span class="card-glow" aria-hidden="true"></span>
          <header>
            <p class="eyebrow">Sign in</p>
            <h1>欢迎回来</h1>
            <p class="sub">登录后继续你的<span id="roleWord">课程任务与复核</span></p>
          </header>

          <div class="roles" role="radiogroup" aria-label="选择身份">
            <span class="roles-pill" aria-hidden="true"></span>
            <button type="button" role="radio" aria-checked="true" data-role="teacher">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5-9-5z" /><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5" /></svg>
              教师
            </button>
            <button type="button" role="radio" aria-checked="false" data-role="student">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" /></svg>
              学生
            </button>
          </div>

          <label class="field" data-field="email">
            <input id="email" type="email" autocomplete="username" placeholder=" " required />
            <span class="lbl">账号邮箱</span>
            <svg class="f-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M4 7l8 6 8-6" /></svg>
            <small class="err" role="alert"></small>
          </label>

          <label class="field" data-field="password">
            <input id="password" type="password" autocomplete="current-password" placeholder=" " required minlength="12" />
            <span class="lbl">密码</span>
            <svg class="f-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
            <button type="button" class="peek" id="peek" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /><path class="slash" d="M4 4l16 16" /></svg>
            </button>
            <small class="err" role="alert"></small>
          </label>

          <div class="row">
            <label class="check"><input type="checkbox" checked /><span class="box"></span>保持登录</label>
            <a href="#" class="link">忘记密码？</a>
          </div>

          <button class="btn btn-primary submit" id="submit" type="submit" data-magnetic="0.15">
            <span class="s-text">登录</span>
            <span class="spinner" aria-hidden="true"></span>
            <svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
          </button>

          <p class="hint mono">原型演示 · 输入任意邮箱与 12 位以上密码即可体验登录动效</p>
        </form>
        <a class="back" href="index.html">← 返回首页</a>
      </section>
    </main>

    <!-- 登录成功转场 -->
    <div class="wipe" id="wipe" aria-hidden="true">
      <div class="wipe-inner">
        <span class="brand-mark big"><i></i></span>
        <p id="wipeText">正在进入教师工作台…</p>
      </div>
    </div>

    <script src="shared/core.js"></script>
    <script src="shared/liquid.js"></script>
    <script src="shared/scene.js"></script>
    <script src="login.js"></script>
  </body>
</html>
