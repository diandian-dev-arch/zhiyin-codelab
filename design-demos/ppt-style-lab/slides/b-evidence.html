<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知因 CodeLab · 调查图谱 · 证据链</title><link rel="stylesheet" href="b.css"></head><body>
<main class="slide evidence" aria-label="Agent 工作方式与真实课程报告界面">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 10C14 5 8 5 3 7v25c6-2 12-1 17 3 4-4 11-5 17-3V7c-6-2-12-2-17 3v25"/><path d="m25 17 4 4 7-8"/></svg>知因 <span>CodeLab</span></div>
  <div class="top-note">AGENT / INVESTIGATION ATLAS</div>
  <h1>从一个问题，<br>到一条可核查的<span>证据链</span></h1>
  <div class="title-rule"></div>
  <section class="process" aria-label="Agent 三步能力关系示意">
    <article class="step"><span class="index">01</span><h2>提出问题</h2><p>明确调查目标与项目上下文</p></article>
    <article class="step"><span class="index">02</span><h2>调查取证</h2><p>按需补查、读取源码、保留引用</p></article>
    <article class="step"><span class="index">03</span><h2>核查结论</h2><p>对照证据审阅，<span>必要时修订或撤回</span></p></article>
  </section>
  <aside class="teacher-note">课程反馈由教师审核后发布</aside>
  <figure class="shot"><div class="shot-label"><span>课程报告 · 真实界面</span><span>COURSE REPORT</span></div><div class="image-frame"><img src="../assets/course-report.png" alt="真实课程报告回放页面，展示检查结果与过程时间线；此次运行关闭 AI"></div><figcaption>课程样本实录 · <strong>此次运行关闭 AI</strong></figcaption></figure>
  <div class="foot-line"></div><div class="scope-note">左侧为能力关系示意；右侧展示课程报告界面，不作为 Agent 质量证据。</div>
</main>
<script>function fit(){document.querySelector('.slide').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',fit);fit();Promise.all([document.fonts.ready,...Array.from(document.images).map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r}))]).then(()=>window.__ready=true);</script>
</body></html>
