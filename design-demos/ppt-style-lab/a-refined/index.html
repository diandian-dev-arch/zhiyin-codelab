<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知因 CodeLab · A 动态精修版</title><link rel="stylesheet" href="player.css"></head>
<body><header><a class="wordmark" href="../index.html#a/cover">知因 <span>CodeLab</span></a><span class="edition">A / 明亮产品发布 · 精修版</span><a class="back" href="../index.html#a/cover">对照初稿 ↗</a></header>
<main><section class="intro"><div><p class="eyebrow">DESIGN IN MOTION</p><h1>让重点，在恰好的时刻出现。</h1></div><p>沿着 A 的留白与蓝色继续打磨。<br>点选线索、聚焦步骤，体验适合现场讲述的节奏。</p></section>
<div class="topbar"><nav aria-label="选择幻灯片"><button data-page="cover" aria-pressed="true">封面</button><button data-page="evidence" aria-pressed="false">证据链</button></nav><div class="settings"><label>蓝色调 <select id="palette" aria-label="蓝色调"><option value="cobalt">钴蓝 · 鲜明</option><option value="ink">深海蓝 · 沉稳</option><option value="azure">清透蓝 · 轻盈</option></select></label><button id="motion" aria-pressed="true">动效 开</button><button id="fullscreen">全屏演示 ↗</button></div></div>
<section id="player" class="player" aria-label="幻灯片播放器"><div class="screen"><iframe id="slide" src="cover.html" title="知因 CodeLab 精修封面" allowfullscreen></iframe></div>
<div class="transport"><div class="playback"><button id="play" aria-label="播放入场动效">播放</button><button id="replay" aria-label="重播入场动效">重播 ↺</button><input id="timeline" type="range" min="0" max="2600" step="10" value="0" aria-label="入场动效进度"><span id="time">0.0 / 2.6s</span></div><div class="page-controls"><button id="prev" aria-label="上一页">←</button><span id="count">01 / 02</span><button id="next" aria-label="下一页">→</button><button id="exit-fullscreen" aria-label="退出全屏">退出全屏</button></div></div></section>
<section class="guide"><div><span class="guide-label">讲述焦点</span><div class="focus-buttons" aria-label="聚焦讲述步骤"><button data-focus="-1" aria-pressed="true">全貌</button><button data-focus="0" aria-pressed="false">源码引用</button><button data-focus="1" aria-pressed="false">调查路径</button><button data-focus="2" aria-pressed="false">核查反馈</button></div></div><p>← → 翻页 · 空格 播放 / 暂停 · R 重播<br>内容页可点击步骤，也可放大查看报告。</p></section>
<div id="status" role="status"></div><footer><span>本轮精修：色彩层次 / 标题排印 / 证据括号 / 可控动效</span><span>两页风格样张 · 历史实录保持原样</span></footer></main><script src="player.js"></script></body></html>
