<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知因 CodeLab · A 精修内容页</title><link rel="stylesheet" href="slides.css"></head>
<body><main class="slide evidence">
<div class="brand"><span class="brand-sign" aria-hidden="true"></span>知因 <span class="latin">CodeLab</span></div><div class="running">智能体的工作方式</div>
<h1 class="content-title" data-enter="0">从一个问题，<br>到一条<span>可核查的证据链。</span></h1>
<div class="content-kicker" data-enter="300"><span>提出问题</span><i>→</i><span>调查取证</span><i>→</i><span>核查结论</span></div>
<section class="steps" aria-label="选择要讲解的步骤">
<button class="step" data-focus="0" data-enter="500" aria-pressed="false"><span class="step-number">01</span><span><strong>提出问题</strong><span class="step-copy">明确调查目标与项目上下文</span></span><span class="step-arrow" aria-hidden="true">↗</span></button>
<button class="step" data-focus="1" data-enter="760" aria-pressed="false"><span class="step-number">02</span><span><strong>调查取证</strong><span class="step-copy">按需补查、读取源码、保留引用</span></span><span class="step-arrow" aria-hidden="true">↗</span></button>
<button class="step" data-focus="2" data-enter="1020" aria-pressed="false"><span class="step-number">03</span><span><strong>核查结论</strong><span class="step-copy">对照证据审阅，必要时修订或撤回</span></span><span class="step-arrow" aria-hidden="true">↗</span></button>
</section>
<aside class="teacher-note" data-enter="1350"><span class="check" aria-hidden="true">✓</span><span>课程反馈由教师审核后发布</span></aside>
<figure class="report" data-enter="500"><figcaption><span class="report-label">课程报告 · 历史实录</span><span class="image-hint">点击放大 ↗</span></figcaption><button class="image-button" id="open-image" aria-label="放大查看历史课程报告"><img src="../assets/course-report.png" alt="历史课程回放页面，包含课程报告和过程时间线，此次运行关闭 AI"></button><div class="report-note"><span class="status-dot"></span>此次运行关闭 AI · 此图仅展示报告界面</div></figure>
<div class="focus-strip"><span class="focus-label" id="focus-label">能力关系示意</span><p id="focus-description" aria-live="polite">结论连着依据，反馈经过审阅。</p></div>
<dialog id="image-dialog" aria-label="历史课程报告大图"><button id="close-image" class="close-image" aria-label="关闭大图">关闭 ×</button><img src="../assets/course-report.png" alt="历史课程报告完整大图，此次运行关闭 AI"></dialog>
</main><script src="motion.js"></script></body></html>
