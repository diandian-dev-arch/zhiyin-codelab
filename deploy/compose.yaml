name: zhiyin-codelab
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.api
  environment: &env
    DATABASE_URL: postgres://codelab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/codelab
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    EXECUTION_APPROVED: ${EXECUTION_APPROVED:-false}
    RUNNER_URL: ${RUNNER_URL:-http://127.0.0.1:3200}
    RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    MODEL_NAME: ${MODEL_NAME:-}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD}
  volumes:
    - evidence:/app/.data
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_USER: codelab
      POSTGRES_DB: codelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U codelab]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *app
    command: [pnpm, exec, tsx, apps/api/src/seed.ts]
  api:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
  worker:
    <<: *app
    profiles: [execution]
    command: [pnpm, exec, tsx, apps/api/src/worker.ts]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres:
  evidence:
